<!doctype html>
<html lang="en" data-theme="eclipse" data-accent="gold" data-density="cozy" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/branding/7anime-icon-128.png" />
    <title>7Anime — Watch Anime Free in HD, English Sub and Dub</title>
    <meta name="description" content="Discover, stream, and customize your anime experience with 7Anime. Featuring high-contrast themes, customized accents, and cinematic presentation." />
    <!-- Geist & Geist Mono Typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pre-paint Theme Initializer to prevent FOUC -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('7anime_appearance_settings_v1');
          if (raw) {
            var s = JSON.parse(raw);
            var el = document.documentElement;
            if (s.theme) el.dataset.theme = s.theme;
            if (s.accent) el.dataset.accent = s.accent;
            if (s.density) el.dataset.density = s.density;
            if (s.textSize) el.dataset.textSize = s.textSize;
            if (s.motion) el.dataset.motion = s.motion;
            if (s.accent === 'custom' && s.customAccentHex) {
              var r = parseInt(s.customAccentHex.slice(1, 3), 16) || 255;
              var g = parseInt(s.customAccentHex.slice(3, 5), 16) || 184;
              var b = parseInt(s.customAccentHex.slice(5, 7), 16) || 77;
              el.style.setProperty('--seven-accent', r + ' ' + g + ' ' + b);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
